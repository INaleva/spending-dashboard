}

function fixedCard(M) {
  const end = M.isCurrent ? M.fixedExpected : (M.prev.length ? mean(M.prev.map(x => model(x).exp.fixed)) : null);
  return h('section', { class: 'card' },
    h('div', { class: 'card-body' },
      h('h2', { text: 'הוצאות קבועות' }),
      figs(M.isCurrent ? 'יצא עד עכשיו' : 'יצא', M.exp.fixed, M.isCurrent ? 'צפוי לצאת' : 'ממוצע 3 חודשים קודמים', end, '--fixed-text'),
      bar('--fixed', end ? M.exp.fixed / end : 1),
      M.isCurrent && M.fe.pending.length ? h('div', { class: 'leftover' }, `עוד ${M.fe.pending.length} חיובים צפויים החודש בסך `, amt(sum(M.fe.pending.map(x => x.amt)))) : null),
    expandable('פירוט חודשי לפי קבוצה', null, fixedGroupList(M)));
}

// ---------- fixed expenses grouped (rules.json → fixedGroups) ----------
// A payee goes to the group named like its category (set with "שינוי"), else the first group whose
// pattern matches its description, else the first group listing its category, else the last group.
const FIXED_GROUPS = (D.fixedGroups || []).map(g => ({ ...g, re: g.pattern ? new RegExp(g.pattern, 'i') : null }));
function fixedGroupOf(desc, cat) {
  if (!FIXED_GROUPS.length) return 'כל ההוצאות הקבועות';
  return (FIXED_GROUPS.find(g => g.name === cat)
    || FIXED_GROUPS.find(g => g.re && g.re.test(desc))
    || FIXED_GROUPS.find(g => (g.categories || []).includes(cat))
    || FIXED_GROUPS[FIXED_GROUPS.length - 1]).name;
}
function fixedGroupList(M) {
  const names = FIXED_GROUPS.length ? FIXED_GROUPS.map(g => g.name) : ['כל ההוצאות הקבועות'];
  const of = item => fixedGroupOf(item.desc, item.cat ?? item.rows?.[0]?.cat);
  const groups = names.map(name => {
    const plan = {
      paid: M.fe.paid.filter(p => of(p) === name),
      pending: M.fe.pending.filter(p => of(p) === name),
      stopped: (M.fe.stopped || []).filter(p => of(p) === name),
    };
    return { name, plan, paid: sum(plan.paid.map(p => p.amt)), pending: M.isCurrent ? sum(plan.pending.map(p => p.amt)) : 0 };
  }).filter(g => g.plan.paid.length || (M.isCurrent && (g.plan.pending.length || g.plan.stopped.length)));
  if (!groups.length) return h('p', { class: 'hint', text: 'אין' });
  return h('div', null, groups.map(g => expandable(g.name,
    h('span', { class: 'hint' }, 'שולם ', amt(g.paid), g.pending ? [' · עוד צפוי ', amt(g.pending)] : null),
    planRows(g.plan, { showPending: M.isCurrent }))));
}

// where a part's expected amount comes from, plus the "שינוי" link (current month, served mode only)
function expectedSource(p, M) {
  return h('div', { class: 'hint', style: 'margin-top:6px' },
    p.budget != null ? 'צפוי לצאת לפי סכום שקבעת' : p.avg != null ? 'צפוי לצאת לפי ממוצע 3 החודשים הקודמים' : 'אין עדיין היסטוריה לחישוב צפי',
    M.isCurrent && window.SYNC_TOKEN
      ? h('button', { type: 'button', class: 'edit-btn', text: 'שינוי הצפי', 'aria-label': `שינוי הצפוי לצאת: ${p.name}`, onclick: () => openBudget(p) })
      : null);
}

// a category that would read "יצא ₪0 · צפוי ₪0" (after rounding) is not shown
const isShown = p => Math.round(p.spent) !== 0 || Math.round(p.expected ?? 0) !== 0;
function partList(M) {
  // every category that spent or is expected to, so the rows add up to the card's "צפוי לצאת"
  const forecastOf = p => Math.max(p.spent, p.expected ?? p.spent);
  const parts = M.parts.filter(isShown).sort((a, b) => forecastOf(b) - forecastOf(a));
  if (!parts.length) return h('p', { class: 'hint', text: 'אין תנועות' });
  return h('div', null, parts.map(p => expandable(p.name,
    h('span', { class: 'hint' + (p.expected != null && p.spent > p.expected ? ' neg' : '') },
      'יצא ', amt(p.spent), p.expected != null ? [' · צפוי ', amt(p.expected)] : null),
    h('div', null, expectedSource(p, M), txnRows(p.rows)))));
}

function variableCard(M) {
  // current month: the forecast (each category at its expected amount, or what it already spent if more),
  // so "צפוי לצאת" − "יצא עד עכשיו" = "נשאר להוציא"
  const end = M.isCurrent ? M.varExpected : M.varPlanned || M.avgVar;
  return h('section', { class: 'card' },
    h('div', { class: 'card-body' },
      h('h2', { text: 'הוצאות משתנות' }),
      figs(M.isCurrent ? 'יצא עד עכשיו' : 'יצא', M.exp.variable, M.isCurrent ? 'צפוי לצאת' : 'צפוי היה לצאת', end, '--variable-text'),
      bar('--variable', end ? M.exp.variable / end : 1),
      // current month: the same per-category "left" as the widget (an overspent category doesn't use up the others)
      M.isCurrent
        ? [h('div', { class: 'leftover' }, 'נשאר להוציא ', amt(M.varExpected - M.exp.variable)),
           M.varOver ? h('div', { class: 'leftover over' }, 'הצפי כולל חריגה של ', amt(M.varOver), ' בקטגוריות שכבר עברו את הצפי שלהן (', amt(M.varPlanned), ' לפי הצפי + ', amt(M.varOver), ')') : null]
        : end != null ? leftoverLine(end, M.exp.variable, 'פחות מהצפוי ב־') : null,
      h('div', { class: 'hint', style: 'margin-top:6px', text: 'הצפי הוא סכום הצפי של כל הקטגוריות. אפשר לשנות אותו לכל קטגוריה בפירוט למטה.' })),
    expandable('פירוט חודשי לפי קטגוריה', null, partList(M)));
}

function trackedCards(M) {
  return M.parts.filter(p => p.tracked).map(p => {
    if (!isShown(p)) return null;
    return h('section', { class: 'card' },
      h('div', { class: 'card-body' },
        h('h2', { text: p.name }),
        figs(M.isCurrent ? 'יצא עד עכשיו' : 'יצא', p.spent, M.isCurrent ? 'צפוי לצאת' : 'צפוי היה לצאת', p.expected, '--tracked-text'),
        bar('--tracked', p.expected ? p.spent / p.expected : 1),
        p.expected != null ? leftoverLine(p.expected, p.spent, M.isCurrent ? 'נשאר להוציא' : 'פחות מהצפוי ב־') : null,
        expectedSource(p, M)),
      expandable('פירוט חודשי', null, txnRows(p.rows)));
  }).filter(Boolean);
}

// ---------- installments and loans (current month) ----------
// Installment plans from the card data: the latest known payment of each plan → payments left, amount left,
// last month. Loans: monthly bank payments (the bank doesn't send the remaining principal).
function debtCard(M) {
  if (!M.isCurrent) return null;
  const plans = new Map();
  for (const t of ALL) {
    if (t.kind !== 'spend' || !t.instT) continue;
    const k = t.plan || `${t.key}|${t.instT}|${Math.round(t.amt)}`; // one plan per purchase (voucher)
    const cur = plans.get(k);
    if (!cur || t.instN > cur.instN) plans.set(k, t);
  }
  const active = [...plans.values()].map(t => {
    const left = t.instT - t.instN;
    return { desc: t.desc, src: t.src, amt: t.amt, n: t.instN, total: t.instT, left, leftAmt: left * t.amt, last: addMonths(t.m, left) };
  }).filter(p => p.last >= FM).sort((a, b) => b.leftAmt - a.leftAmt);
  const loanRows = ALL.filter(t => t.kind === 'spend' && t.flow === 'fixed' && !t.instT && fixedGroupOf(t.desc, t.cat) === 'הלוואות');
  const recent = prevMonths(FM, 3).concat(FM);
  const loans = new Map();
  for (const t of loanRows) {
    if (!recent.includes(t.m)) continue;
    if (!loans.has(t.key)) loans.set(t.key, { desc: t.desc, months: new Map() });
    const l = loans.get(t.key);
    l.months.set(t.m, (l.months.get(t.m) || 0) + t.amt);
  }
  const loanList = [...loans.values()].map(l => ({ desc: l.desc, monthly: mean([...l.months.values()]), lastMonth: [...l.months.keys()].sort().pop() }))
    .filter(l => l.lastMonth >= prevMonths(FM, 1)[0]).sort((a, b) => b.monthly - a.monthly);
  if (!active.length && !loanList.length) return null;
  const monthlyInst = sum(active.filter(p => p.left > 0 || p.last === FM).map(p => p.amt));
  const leftInst = sum(active.map(p => p.leftAmt));
  return h('section', { class: 'card' },
    h('div', { class: 'card-body' },
      h('h2', { text: 'תשלומים והלוואות' }),
      h('div', { class: 'figs' },
        h('div', { class: 'fig' }, h('div', { class: 'k', text: 'נשאר לשלם בתשלומים' }), h('div', { class: 'v', style: 'color:var(--fixed-text)' }, amt(leftInst))),
        h('div', { class: 'fig end' }, h('div', { class: 'k', text: 'לחודש (תשלומים + הלוואות)' }), h('div', { class: 'v' }, amt(monthlyInst + sum(loanList.map(l => l.monthly)))))),
      h('p', { class: 'hint', style: 'margin:4px 0 0', text: 'יתרת הקרן של הלוואות מהבנק לא מגיעה בנתונים, לכן מוצג רק התשלום החודשי.' })),
    active.length ? expandable(`תשלומים באשראי (${active.length})`, h('span', { class: 'hint' }, amt(leftInst)),
      h('ul', { class: 'rows' }, active.map(p => h('li', null,
        h('span', { class: 'name', text: p.desc }),
        h('span', { class: 'val' }, amt(p.leftAmt)),
        h('span', { class: 'meta', text: `${amtText(p.amt)} לחודש · שולמו ${p.n} מתוך ${p.total} · ${p.left ? `עוד ${p.left} תשלומים, אחרון ב־${monthName(p.last)}` : 'התשלום האחרון'} · ${p.src}` }))))) : null,
    loanList.length ? expandable(`הלוואות (${loanList.length})`, null,
      h('ul', { class: 'rows' }, loanList.map(l => h('li', null,
        h('span', { class: 'name', text: l.desc }),
        h('span', { class: 'val' }, amt(l.monthly)),
        h('span', { class: 'meta', text: 'ממוצע חודשי (3 חודשים אחרונים)' }))))) : null);
}

// ---------- sync status per source ----------
const ERROR_NAMES = { INVALID_PASSWORD: 'סיסמה שגויה', CHANGE_PASSWORD: 'נדרשת החלפת סיסמה', ACCOUNT_BLOCKED: 'החשבון חסום',
  TIMEOUT: 'פג הזמן', GENERIC: 'שגיאה כללית (ייתכן חסימת בוט)', CRASH: 'קריסה', TWO_FACTOR_RETRIEVER_MISSING: 'נדרש קוד SMS' };
const STALE_DAYS = 3;
function sourceStatus(s) {
  const failedAfter = s.lastFailure && (!s.lastScrape || s.lastFailure.at > s.lastScrape);
  const ageDays = s.lastScrape ? (Date.now() - Date.parse(s.lastScrape)) / 86400000 : Infinity;
  if (failedAfter) return { level: 'error', text: `הסנכרון האחרון נכשל: ${ERROR_NAMES[s.lastFailure.errorType] || s.lastFailure.errorType}` };
  if (ageDays > STALE_DAYS) return { level: 'warn', text: s.lastScrape ? `לא סונכרן ${Math.floor(ageDays)} ימים` : 'עוד לא סונכרן' };
  return { level: 'ok', text: 'תקין' };
}
const fmtTime = iso => (iso ? new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');
function syncCard() {
  const list = (D.sources || []).map(s => ({ s, st: sourceStatus(s) }));
  if (!list.length) return null;
  return h('section', { class: 'card' }, h('div', { class: 'card-body' },
    h('h2', { text: 'מצב סנכרון' }),
    h('ul', { class: 'rows' }, list.map(({ s, st }) => h('li', null,
      h('span', { class: 'name' }, h('span', { class: st.level === 'ok' ? 'pos' : 'neg', style: 'font-weight:700', text: st.level === 'ok' ? '✓ ' : '⚠ ' }), s.name),
      h('span', { class: 'val ' + (st.level === 'ok' ? '' : 'neg'), text: st.text }),
      h('span', { class: 'meta', text: `סנכרון מוצלח אחרון: ${fmtTime(s.lastScrape)}${s.lastFailure ? ` · כישלון אחרון: ${fmtTime(s.lastFailure.at)}` : ''}` }))))));
}

function outsideCard(M) {
  const inSum = M.A.s(M.A.outIn), outSum = M.A.s(M.A.outOut);
  if (!inSum && !outSum) return null;
  return h('section', { class: 'card' },
    h('div', { class: 'card-body' },
      h('h2', { text: 'לא בתזרים' }),
      h('div', { class: 'gap-row' }, h('span', { text: 'סיכום פער לא בתזרים:' }), h('span', { class: inSum - outSum < 0 ? 'neg' : 'pos' }, amt(inSum - outSum))),
      h('p', { class: 'hint', style: 'margin:8px 0 0', text: 'חיסכון, השקעות, הלוואות שהתקבלו והעברות שלא נספרות כהכנסה או כהוצאה.' })),
    expandable('פירוט הכנסות לא תזרימיות', h('span', { class: 'hint' }, amt(inSum)), txnRows(M.A.outIn)),
    expandable('פירוט הוצאות לא תזרימיות', h('span', { class: 'hint' }, amt(outSum)), txnRows(M.A.outOut)));
}

// ---------- unusual costs (same detection as before, for the selected month) ----------
function findAlerts(m) {
  const months = MONTHS;
  const spend = ALL.filter(t => t.kind === 'spend');
  const cell = new Map();
  for (const t of spend) { const k = t.m + '|' + t.cat; if (!cell.has(k)) cell.set(k, []); cell.get(k).push(t); }
  const val = (x, c) => sum((cell.get(x + '|' + c) || []).map(t => t.amt));
  const cats = [...new Set(spend.map(t => t.cat))];
  const out = [];
  const prior6 = months.filter(x => x < m).slice(-6);
  if (prior6.length >= 3) {
    for (const c of cats) {
      const vals = prior6.map(x => val(x, c)), v = val(m, c), mu = mean(vals), s = sd(vals);
      const nonZero = vals.filter(x => x > 0);
      const usual = nonZero.length && nonZero.length <= vals.length * 2 / 3 ? mean(nonZero) : mu;
      if (v - mu >= 250 && v > mu + Math.max(2 * s, 0.25 * mu) && v - usual >= 250 && v > usual * 1.4) {
        const top = (cell.get(m + '|' + c) || []).slice().sort((a, b) => b.amt - a.amt).slice(0, 2);
        out.push({ kind: 'קפיצה בקטגוריה', impact: v - usual, title: c,
          detail: `${amtText(v)} לעומת ${amtText(usual)} בדרך כלל. הגדולות: ${top.map(t => `${t.desc} ${amtText(t.amt)}`).join(' · ')}` });
      }
    }
  }
  const firstSeen = new Map();
  for (const t of spend.slice().sort((a, b) => (a.d < b.d ? -1 : 1))) { const k = normDesc(t.desc); if (!firstSeen.has(k)) firstSeen.set(k, t.d); }
  // single purchases: only itemized variable spending (a mortgage or a lump card bill is not a "purchase")
  for (const t of spend) {
    if (t.m !== m || t.amt < 400 || (t.instT && t.instN !== 1)) continue;
    if ((t.flow === 'fixed' && !t.instT) || t.cat.endsWith('ללא פירוט')) continue;
    const full = t.instT ? t.amt * t.instT : t.amt;
    const prior = spend.filter(x => x.cat === t.cat && x.d < t.d && x.m >= addMonths(m, -12) && !x.instT).map(x => x.amt);
    const typical = median(prior);
    // a merchant you regularly pay this much (weekly online groceries) is not unusual
    const sameMerchant = spend.filter(x => normDesc(x.desc) === normDesc(t.desc) && x.d < t.d && x.m >= addMonths(m, -12)).map(x => x.amt);
    const usualHere = sameMerchant.length >= 2 && median(sameMerchant) >= 0.6 * t.amt;
    const big = prior.length >= 5 && t.amt >= 3 * typical && !usualHere;
    const isNew = firstSeen.get(normDesc(t.desc)) === t.d && full >= 1000 && months.indexOf(m) >= 3;
    if (big || isNew) out.push({ kind: 'רכישה גדולה', impact: full, title: t.desc,
      detail: `${amtText(t.amt)}${t.instT ? ` (תשלום 1 מתוך ${t.instT}, סה״כ ${amtText(full)})` : ''} · ${t.cat} · ${big ? `פי ${(t.amt / typical).toFixed(1)} מרכישה רגילה בקטגוריה` : 'פעם ראשונה אצל בית העסק'}` });
  }
  const merchants = new Map();
  for (const t of spend) {
    if (t.instT) continue;
    const k = normDesc(t.desc);
    if (!merchants.has(k)) merchants.set(k, { desc: t.desc, months: new Map() });
    const mm = merchants.get(k).months; mm.set(t.m, (mm.get(t.m) || 0) + t.amt);
  }
  for (const mer of merchants.values()) {
    const ms = [...mer.months.keys()].sort();
    if (!mer.months.has(m)) continue;
    const window3 = [addMonths(m, -2), addMonths(m, -1), m].filter(x => mer.months.has(x));
    if (window3.length >= 2 && ms[0] >= addMonths(m, -2) && months.indexOf(ms[0]) >= 6) {
      const a = window3.map(x => mer.months.get(x));
      if (Math.max(...a) <= 1.15 * Math.min(...a) && mean(a) >= 10)
        out.push({ kind: 'חיוב קבוע חדש', impact: mean(a) * 12, title: mer.desc, detail: `כ־${amtText(mean(a))} בחודש מאז ${monthName(ms[0])} · כ־${amtText(mean(a) * 12)} בשנה` });
    }
    const pm = [addMonths(m, -1), addMonths(m, -2), addMonths(m, -3)];
    if (pm.every(x => mer.months.has(x))) {
      const pa = pm.map(x => mer.months.get(x)), p = median(pa), now = mer.months.get(m);
      if (Math.max(...pa) <= 1.05 * Math.min(...pa) && now >= p * 1.08 && now - p >= 5)
        out.push({ kind: 'עליית מחיר', impact: (now - p) * 12, title: mer.desc, detail: `${amtText(p)} ← ${amtText(now)} בחודש (+${Math.round((now / p - 1) * 100)}%) · כ־${amtText((now - p) * 12)} יותר בשנה` });
    }
  }
  // possible double charge: same card merchant, same amount, the same or the next day (separate transactions).
  // Can be legitimate (two tickets, two vouchers) — it's a "worth checking", not an error.
  const cardSpend = spend.filter(t => t.m === m && !isBank(t.src) && !t.instT && t.amt >= 20);
  const byCharge = new Map();
  for (const t of cardSpend) {
    const k = `${t.src}|${normDesc(t.desc)}|${Math.round(t.amt * 100)}`;
    if (!byCharge.has(k)) byCharge.set(k, []);
    byCharge.get(k).push(t);
  }
  for (const rows of byCharge.values()) {
    if (rows.length < 2) continue;
    rows.sort((a, b) => (a.d < b.d ? -1 : 1));
    const close = rows.filter((t, i) => rows.some((u, j) => j !== i && Math.abs(Date.parse(t.d) - Date.parse(u.d)) <= 86400000));
    if (close.length < 2) continue;
    out.push({ kind: 'חיוב כפול אפשרי', impact: close[0].amt * (close.length - 1) + 1e6, title: close[0].desc,
      detail: `${close.length} חיובים של ${amtText(close[0].amt)} ב־${close.map(t => shortDate(t.d)).join(', ')} · ${close[0].src} · אם זה לא אתם — כדאי לבדוק מול חברת האשראי` });
  }
  return out.sort((a, b) => b.impact - a.impact);
}

function alertsCard(M) {
  const alerts = findAlerts(M.m);
  return h('section', { class: 'card' }, h('div', { class: 'card-body' },
    h('h2', { text: 'שווה לבדוק' }),
    alerts.length
      ? h('ul', { class: 'alerts' }, alerts.slice(0, 12).map(a => h('li', null,
          h('span', { class: 'ico', text: '!', 'aria-hidden': 'true' }),
          h('div', null, h('div', { class: 'kind', text: a.kind }), h('div', { class: 'title', text: a.title })),
          h('div', { class: 'detail', text: a.detail }))))
      : h('p', { class: 'hint', text: 'לא נמצאו הוצאות חריגות החודש.' })));
}

function searchCard(M) {
  const input = h('input', { class: 'search', type: 'search', placeholder: 'חיפוש תנועה בכל החודשים', 'aria-label': 'חיפוש תנועה' });
  const results = h('div', null, txnRows(M.A.rows.filter(t => t.kind !== 'card-bill')));
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    const rows = q ? ALL.filter(t => t.desc.toLowerCase().includes(q) || (t.memo || '').toLowerCase().includes(q)).slice(0, 200)
      : M.A.rows;
    results.replaceChildren(txnRows(rows, { emptyText: 'לא נמצאו תנועות' }));
  });
  return h('section', { class: 'card' }, expandable(`כל התנועות של ${monthName(M.m, false)}`, null, h('div', null, input, results)));
}

// ---------- page ----------
// ---------- edit dialog: move a transaction (or every transaction of a merchant) ----------
const FLOW_NAME = { fixed: 'קבועה', variable: 'משתנה' };
let editing = null;
function openEdit(t) {
  editing = t;
  const dlg = $('#edit-dialog');
  $('#edit-title').textContent = t.desc;
  $('#edit-sub').textContent = `${shortDate(t.d)} · ${amtText(t.amt)} · ${t.src}`;
  const cats = new Set(D.transactions.filter(x => x.kind === 'spend').map(x => x.cat));
  for (const g of D.tracked || []) g.categories.forEach(c => cats.add(c));
  for (const c of D.extraCategories || []) cats.add(c);
  if (t.flow === 'fixed' && t.kind === 'spend') for (const g of D.fixedGroups || []) cats.add(g.name); // move into a fixed group
  $('#edit-cats').replaceChildren(...[...cats].sort((a, b) => a.localeCompare(b, 'he')).map(c => h('option', { value: c })));
  const excluded = t.kind === 'ignored';
  $('#edit-cat').value = excluded ? '' : t.cat;
  $('#edit-cat').disabled = excluded;
  // fixed <-> variable: "הוצאה קבועה / הוצאה משתנה" (or income), kept with the category in one save
  const noun = t.kind === 'income' ? 'הכנסה' : 'הוצאה';
  const flowSel = $('#edit-flow');
  flowSel.options[1].textContent = `${noun} קבועה`;
  flowSel.options[2].textContent = `${noun} משתנה`;
  flowSel.options[0].textContent = t.flow ? `אוטומטי (כרגע: ${noun} ${FLOW_NAME[t.flow]})` : 'אוטומטי';
  flowSel.value = '';
  $('#edit-exclude').checked = excluded;
  $('#edit-oneoff').checked = !!t.oneOff;
  $('#edit-merchant-label').textContent = `כל התנועות של "${t.desc}" (גם בעתיד)`;
  dlg.querySelector('input[name="scope"][value="' + (t.ov === 'merchant' ? 'merchant' : 'txn') + '"]').checked = true;
  $('#edit-reset').hidden = !t.ov;
  $('#edit-err').textContent = '';
  dlg.showModal();
  (excluded ? $('#edit-exclude') : $('#edit-cat')).focus();
}
$('#edit-exclude').addEventListener('change', e => { $('#edit-cat').disabled = e.target.checked; });
$('#edit-cancel').addEventListener('click', () => $('#edit-dialog').close());

async function saveEdit(reset) {
  const t = editing;
  const scope = $('#edit-dialog').querySelector('input[name="scope"]:checked').value;
  const exclude = $('#edit-exclude').checked;
  const cat = $('#edit-cat').value.trim();
  if (!reset && !exclude && !cat) { $('#edit-err').textContent = 'צריך לבחור קטגוריה'; return; }
  const body = reset ? { scope: t.ov || scope, id: t.id, mk: t.mk, reset: true }
    : { scope, id: t.id, mk: t.mk, exclude, cat: exclude ? null : cat, flow: $('#edit-flow').value || null, oneOff: $('#edit-oneoff').checked };
  $('#edit-err').textContent = 'שומר…';
  $('#edit-dialog').querySelectorAll('button').forEach(b => { b.disabled = true; });
  try {
    const res = await fetch('/api/override', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Sync-Token': window.SYNC_TOKEN }, body: JSON.stringify(body) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error === 'busy' ? 'סנכרון רץ כרגע, נסו שוב בעוד רגע' : (res.status === 404 ? OLD_SERVER : (out.error || 'השמירה נכשלה')));
    location.reload(); // the server rebuilt data.js with the change
  } catch (e) {
    $('#edit-err').textContent = e.message;
    $('#edit-dialog').querySelectorAll('button').forEach(b => { b.disabled = false; });
  }
}
$('#edit-form').addEventListener('submit', e => { e.preventDefault(); saveEdit(false); });
$('#edit-reset').addEventListener('click', () => saveEdit(true));

// ---------- budget dialog: set "צפוי לצאת" for a category (this month and on) ----------
let budgeting = null;
function openBudget(p) {
  budgeting = p;
  $('#budget-title').textContent = `צפוי לצאת: ${p.name}`;
  $('#budget-sub').replaceChildren(...[
    p.avg != null ? ['ממוצע 3 החודשים הקודמים: ', amt(p.avg)] : 'אין עדיין ממוצע',
    p.budget != null ? [' · כרגע: ', amt(p.budget)] : null,
  ].flat().filter(Boolean));
  $('#budget-amount').value = String(Math.round(p.budget ?? p.avg ?? 0));
  $('#budget-reset').hidden = p.budget == null;
  $('#budget-err').textContent = '';
  $('#budget-dialog').showModal();
  $('#budget-amount').select();
}
$('#budget-cancel').addEventListener('click', () => $('#budget-dialog').close());
async function saveBudget(reset) {
  const raw = $('#budget-amount').value.replace(/[,₪\s]/g, '');
  const amount = Number(raw);
  if (!reset && (!/^\d+(\.\d+)?$/.test(raw) || amount > 1e7)) { $('#budget-err').textContent = 'צריך להזין סכום במספרים'; return; }
  $('#budget-err').textContent = 'שומר…';
  $('#budget-dialog').querySelectorAll('button').forEach(b => { b.disabled = true; });
  try {
    const res = await fetch('/api/budget', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Sync-Token': window.SYNC_TOKEN },
      body: JSON.stringify(reset ? { key: budgeting.key, reset: true } : { key: budgeting.key, amount }) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok || !out.ok) throw new Error(out.error === 'busy' ? 'סנכרון רץ כרגע, נסו שוב בעוד רגע' : (res.status === 404 ? OLD_SERVER : (out.error || 'השמירה נכשלה')));
    location.reload();
  } catch (e) {
    $('#budget-err').textContent = e.message;
    $('#budget-dialog').querySelectorAll('button').forEach(b => { b.disabled = false; });
  }
}
$('#budget-form').addEventListener('submit', e => { e.preventDefault(); saveBudget(false); });
$('#budget-reset').addEventListener('click', () => saveBudget(true));

// the selected month survives reloads (after a sync or an edit)
const hashMonth = (location.hash.match(/m=(\d{4}-\d{2})/) || [])[1];
const state = { month: hashMonth && MONTHS.includes(hashMonth) ? hashMonth : FM };
let compare;
function render() {
  history.replaceState(null, '', '#m=' + state.month);
  const M = model(state.month);
  const i = MONTHS.indexOf(state.month);
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= MONTHS.length - 1;
  $('#month-label').replaceChildren(...[monthName(state.month), M.isCurrent ? h('span', { class: 'sub', text: '(החודש)' }) : null].filter(Boolean));
  compare = compareCard(M);
  $('#col-a').replaceChildren(...[balanceCard(M), heroCard(M), variableLeftCard(M), compare, alertsCard(M), outsideCard(M), searchCard(M), syncCard()].filter(Boolean));
  // top bar: a source that failed or hasn't synced in a while
  const bad = (D.sources || []).filter(src => sourceStatus(src).level !== 'ok');
  $('#sync-warn').hidden = !bad.length;
  $('#sync-warn').textContent = bad.length ? '⚠ ' + bad.map(src => src.name).join(', ') + ': בעיה בסנכרון' : '';
  $('#col-b').replaceChildren(...[incomeCard(M), fixedCard(M), debtCard(M), variableCard(M),
    h('div', { class: 'section-title', text: 'קטגוריות למעקב' }), ...trackedCards(M)].filter(Boolean));
}
$('#prev').addEventListener('click', () => { const i = MONTHS.indexOf(state.month); if (i > 0) { state.month = MONTHS[i - 1]; render(); } });
$('#next').addEventListener('click', () => { const i = MONTHS.indexOf(state.month); if (i < MONTHS.length - 1) { state.month = MONTHS[i + 1]; render(); } });
render();
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => compare && compare._redraw(), 120); });
})();
</script>
